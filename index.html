<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宜蘭市中心三房出租</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .property-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            margin-bottom: 20px;
        }
        .property-info {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .map-container {
            width: 100%;
            height: 400px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        .video-container {
            width: 100%;
            margin-bottom: 30px;
            border-radius: 10px;
            overflow: hidden;
            background-color: #000;
        }
        .property-video {
            width: 100%;
            max-height: 500px;
            display: block;
            margin: 0 auto;
        }
        .section-title {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            margin: 30px 0 20px 0;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-5">宜蘭市中心三房出租</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="property-info">
                    <h3>基本資訊</h3>
                    <p><strong>地址：</strong>宜蘭縣宜蘭市民權新路47巷17之1號</p>
                    <p><strong>屋齡：</strong>41.9年 (1983-05-11 竣工)</p>
                    <p><strong>主建物：</strong>23.41坪</p>
                    <p><strong>附屬建物：</strong>3.27坪</p>
                    <p><strong>總建物：</strong>28.42坪</p>
                    <p><strong>樓層：</strong>2樓 / 共5樓</p>
                    <p><strong>建材：</strong>鋼筋混凝土造</p>
                </div>

                <div class="property-info">
                    <h3>聯絡方式</h3>
                    <p><strong>電話：</strong>0928-880-392（林其衞）</p>
                    <p><strong>經紀公司：</strong>有巢氏房屋 - 宜蘭黎明國小加盟店</p>
                    <p><strong>經紀業：</strong>佳慶不動產有限公司</p>
                    <p><strong>經紀人：</strong>江鳳益 (110) 宜字第 00359 號</p>
                </div>

                <div class="property-info">
                    <h3>位置地圖</h3>
                    <div class="map-container">
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d903.9516927962647!2d121.75193522935559!3d24.750797399999998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3467e4dd0a5d4447%3A0x2fb7b5b1bf7f6ec!2zMjYw5a6c6Jit57ij5a6c6Jit5biC5rCR5qyK5paw6Lev!5e0!3m2!1szh-TW!2stw!4v1710600391707!5m2!1szh-TW!2stw" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="video-container mb-4">
                    <video class="property-video" controls preload="metadata">
                        <source src="videos/白色物業詳情出租房地產樓盤 169 影片.mp4" type="video/mp4">
                        您的瀏覽器不支援影片播放。
                    </video>
                </div>

                <!-- 外觀 -->
                <h3 class="section-title">外觀</h3>
                <div class="row">
                    <div class="col-12">
                        <img src="物件外觀.jpg" alt="物件外觀" class="property-image">
                    </div>
                </div>

                <!-- 客廳區 -->
                <h3 class="section-title">客廳區</h3>
                <div class="row">
                    <div class="col-6">
                        <img src="客廳.jpg" alt="客廳" class="property-image">
                    </div>
                    <div class="col-6">
                        <img src="客廳1.jpg" alt="客廳1" class="property-image">
                    </div>
                </div>

                <!-- 臥室區 -->
                <h3 class="section-title">臥室區</h3>
                <div class="row">
                    <div class="col-6">
                        <img src="次臥室.jpg" alt="次臥室" class="property-image">
                    </div>
                    <div class="col-6">
                        <img src="次臥室2.jpg" alt="次臥室2" class="property-image">
                    </div>
                    <div class="col-6">
                        <img src="次臥3.jpg" alt="次臥3" class="property-image">
                    </div>
                </div>

                <!-- 衛浴和廚房區 -->
                <h3 class="section-title">衛浴和廚房區</h3>
                <div class="row">
                    <div class="col-6">
                        <img src="廚房.jpg" alt="廚房" class="property-image">
                    </div>
                    <div class="col-6">
                        <img src="衛浴.jpg" alt="衛浴" class="property-image">
                    </div>
                </div>

                <!-- 陽台和儲藏間 -->
                <h3 class="section-title">陽台和儲藏間</h3>
                <div class="row">
                    <div class="col-6">
                        <img src="陽台.jpg" alt="陽台" class="property-image">
                    </div>
                    <div class="col-6">
                        <img src="陽台2.jpg" alt="陽台2" class="property-image">
                    </div>
                    <div class="col-6">
                        <img src="儲藏間.jpg" alt="儲藏間" class="property-image">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
